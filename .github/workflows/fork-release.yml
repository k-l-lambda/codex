# Simplified release workflow for k-l-lambda/codex fork.
# Usage:
# ```
# git tag -a v2025.1218 -m "Release 2025-12-18"
# git push kl v2025.1218
# ```

name: fork-release
on:
  push:
    tags:
      - "v*"

concurrency:
  group: ${{ github.workflow }}
  cancel-in-progress: true

jobs:
  build:
    name: Build - ${{ matrix.target }}
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 60
    defaults:
      run:
        working-directory: codex-rs

    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: ubuntu-24.04
            target: x86_64-unknown-linux-gnu

    steps:
      - uses: actions/checkout@v4

      - uses: dtolnay/rust-toolchain@1.85
        with:
          targets: ${{ matrix.target }}

      - uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/bin/
            ~/.cargo/registry/index/
            ~/.cargo/registry/cache/
            ~/.cargo/git/db/
            ${{ github.workspace }}/codex-rs/target/
          key: cargo-${{ matrix.runner }}-${{ matrix.target }}-release-${{ hashFiles('**/Cargo.lock') }}

      - name: Cargo build
        run: cargo build --target ${{ matrix.target }} --release --bin codex

      - name: Stage artifacts
        run: |
          mkdir -p dist
          cp target/${{ matrix.target }}/release/codex dist/codex-${{ matrix.target }}
          chmod +x dist/codex-${{ matrix.target }}

      - name: Compress artifacts
        run: |
          cd dist
          tar -czvf codex-${{ matrix.target }}.tar.gz codex-${{ matrix.target }}
          rm codex-${{ matrix.target }}

      - uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.target }}
          path: codex-rs/dist/*

  release:
    needs: build
    name: Create Release
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - uses: actions/download-artifact@v4
        with:
          path: dist

      - name: List artifacts
        run: ls -R dist/

      - name: Flatten artifacts
        run: |
          mkdir -p release
          find dist -type f -name "*.tar.gz" -exec cp {} release/ \;
          ls -la release/

      - name: Extract version from tag
        id: version
        run: |
          version="${GITHUB_REF_NAME#v}"
          echo "version=${version}" >> $GITHUB_OUTPUT

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          name: ${{ steps.version.outputs.version }}
          tag_name: ${{ github.ref_name }}
          files: release/*
          body: |
            ## Codex CLI with pool_idle_timeout_secs

            This release includes the `pool_idle_timeout_secs` configuration option for HTTP connection pool timeout.

            ### Downloads

            - `codex-x86_64-unknown-linux-gnu.tar.gz` - Linux x86_64 (glibc)

            ### Installation

            ```bash
            # Download and extract
            tar -xzf codex-x86_64-unknown-linux-gnu.tar.gz

            # Make executable
            chmod +x codex-x86_64-unknown-linux-gnu

            # Move to PATH
            sudo mv codex-x86_64-unknown-linux-gnu /usr/local/bin/codex
            ```

            ### Configuration

            Add to `~/.codex/config.toml`:
            ```toml
            [model_providers.custom]
            name = "Custom"
            base_url = "https://api.example.com/v1"
            env_key = "API_KEY"
            pool_idle_timeout_secs = 10  # Close idle connections after 10 seconds
            ```
          prerelease: ${{ contains(github.ref_name, '-') }}
