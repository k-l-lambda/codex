name: Test Build Windows Binary

on:
  push:
    branches:
      - test/pool-idle-timeout-config
      - fix/filter-incomplete-tool-calls
  workflow_dispatch:

jobs:
  build-windows:
    runs-on: windows-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: x86_64-pc-windows-msvc

      - name: Cache Cargo registry
        uses: actions/cache@v4
        with:
          path: ~/.cargo/registry
          key: ${{ runner.os }}-cargo-registry-${{ hashFiles('**/Cargo.lock') }}

      - name: Cache Cargo index
        uses: actions/cache@v4
        with:
          path: ~/.cargo/git
          key: ${{ runner.os }}-cargo-git-${{ hashFiles('**/Cargo.lock') }}

      - name: Cache build artifacts
        uses: actions/cache@v4
        with:
          path: codex-rs/target
          key: ${{ runner.os }}-cargo-build-${{ hashFiles('**/Cargo.lock') }}

      - name: Build codex-tui (Release)
        run: |
          cd codex-rs
          cargo build --release --bin codex-tui

      - name: Upload binary artifact
        uses: actions/upload-artifact@v4
        with:
          name: codex-tui-windows-x64
          path: codex-rs/target/release/codex-tui.exe
          retention-days: 7

      - name: Show binary info
        run: |
          Get-ChildItem codex-rs/target/release/codex-tui.exe | Select-Object Name, Length, LastWriteTime
        shell: pwsh
